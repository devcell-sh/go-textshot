name: release

on:
  push:
    tags: ["models-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  models:
    name: Export and publish ONNX models
    runs-on: ubuntu-26.04
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/astral-sh/setup-uv
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      # https://github.com/arduino/setup-task
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Export icon_detect_v3 to ONNX
        run: task models:export

      - name: Verify the export matches the pins in models.go
        run: task models:check

      - name: Publish as release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "ONNX models downloaded by textshot on first use. See models.go for the pins." \
            dist/models/*

      # https://github.com/actions/upload-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type != 'tag'
        with:
          name: models
          path: dist/models/
